{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}0 миллиметров{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-background text-ink min-h-screen flex flex-col">

    {% include 'components/navbar.html' %}

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-10">

        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div class="rounded-xl px-4 py-3 text-sm {% if message.tags == 'success' %}bg-green-100 text-green-800 border border-green-200{% elif message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200{% else %}bg-ink/5{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock content %}
        
    </main>

    {% include 'components/footer.html' %}

</body>
</html>
